{% extends "layout.html" %}

{% block css %}
<link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/x-icon" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/app/core/layout.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/app/core/responsive.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/app/sidebar/structure.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/app/sidebar/controls.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/app/sidebar/history.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/app/sidebar/collapsed.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/chat/core.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/chat/messages.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/chat/input.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/chat/components.css') }}" />
<link rel="stylesheet" href="{{ url_for('chat.static', filename='css/chat/card.css') }}" />

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#2b9dee",
                    "primary-glow": "rgba(43, 157, 238, 0.4)",
                    "glass-border": "rgba(255, 255, 255, 0.4)",
                    "text-main": "#111518",
                    "text-secondary": "#617989",
                },
                fontFamily: {
                    "display": ["Space Grotesk", "sans-serif"],
                    "body": ["Inter", "sans-serif"],
                },
                boxShadow: {
                    'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                }
            },
        },
    }
</script>

<style>
    /* Nền trang (Ambient Background) */
    body {
        font-family: 'Inter', sans-serif;
        background: #f0f4f8;
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.8) 0%, rgba(240, 244, 248, 0) 50%),
            radial-gradient(circle at 90% 80%, rgba(43, 157, 238, 0.08) 0%, rgba(240, 244, 248, 0) 50%);
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Lớp kính mờ cho container chính */
    .glass-panel {
        background: rgba(255, 255, 255, 0.6) !important;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), inset 0 1px 1px rgba(255, 255, 255, 0.9);
        border-radius: 2rem;
    }

    /* Căn chỉnh bố cục để Container nằm giữa đẹp mắt */
    .app {
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center; /* Căn giữa theo chiều dọc nếu muốn */
        height: 100vh;
        padding: 20px;
        box-sizing: border-box;
    }

    /* Ghi đè style của #chatContainer để áp dụng hiệu ứng kính */
    #chatContainer {
        width: 100% !important; 
        max-width: 1600px; /* Giới hạn chiều rộng để đẹp hơn trên màn hình lớn */
        height: 95vh !important; /* Tăng chiều cao một chút */
        background: rgba(255, 255, 255, 0.5) !important;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 2rem;
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
        overflow: hidden; 
        display: flex;
        flex-direction: column;
    }

    /* Làm trong suốt các thành phần con để hòa vào nền kính */
    .chat-list, .chat-input-area, .sidebar {
        background: transparent !important;
    }
</style>
{% endblock %} 

{% block content %}

<div class="fixed top-20 right-[-10%] w-[600px] h-[600px] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-teal-400/10 rounded-full blur-[80px] pointer-events-none z-0"></div>

<div class="app">
  <div
    class="chatContainer glass-panel"
    id="chatContainer"
  >
    {% include "chat_block.html" %}
    
    <div id="chat-toast-box" class="toast-box toast-chat">
      <div class="toast-icon-container"></div>
      <div class="toast-message">Updated successfully!</div>
    </div>
  </div>
</div>
{% endblock %} 

{% block script %}
<script
  type="module"
  src="{{ url_for('chat.static', filename='scripts/logic.js') }}"
></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
{% endblock %}
