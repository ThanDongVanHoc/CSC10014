<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - VietCare</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('auth.static', filename='css/pages/auth-card.css') }}" />

  <link rel="stylesheet" href="{{ url_for('auth.static', filename='css/common.css') }}" />
</head>

<body>
  <div class="auth-card-container">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="VietCare Logo" class="auth-logo" />

    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-instruction">
      Enter your email address and choose a new, strong password.
    </p>

    <form id="resetForm" action="{{ url_for('auth.reset_pass') }}" method="POST" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required
          value="{{ form_data.email or '' }}" />
        <div class="error" id="err-email" aria-live="polite">
          {{ errors.email or '' }}
        </div>
      </div>

      <div class="field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="8+ characters" required />
        <div class="pw-meter" aria-hidden="true">
          <span id="pwBar" style="width: 0%"></span>
        </div>
        <div class="note" id="pwNote">
          Use at least 8 characters including a number and a symbol.
        </div>
        <div class="error" id="err-pw" aria-live="polite">
          {{ errors.password or '' }}
        </div>
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Repeat new password" required />
        <div class="error" id="err-confirm" aria-live="polite">
          {{ errors.confirm or '' }}
        </div>
      </div>

      <div class="buttons-group">
        <a href="{{ url_for('auth.signin_page') }}" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-submit">Update</button>
      </div>
    </form>
  </div>

  <script src="{{ url_for('auth.static', filename='scripts/common.js') }}"></script>
  <script src="{{ url_for('auth.static', filename='scripts/pages/reset-pass.js') }}"></script>
</body>

</html>
