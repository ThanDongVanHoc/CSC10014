<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter Security Code - VietConnect</title>

    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/logo.png') }}"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('auth.static', filename='css/common.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('auth.static', filename='css/pages/auth-card.css') }}"
    />
  </head>
  <body>
    <div class="auth-card-container">
      <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="VietConnect Logo"
        class="auth-logo"
      />

      <h2 class="auth-title">Enter Security Code</h2>
      <p class="auth-instruction">
        Please check your mail for a code we sent to<br />
        <strong>{{ email }}</strong>
      </p>

      <form action="{{ action_url }}" method="POST">
        <div class="field">
          <label for="code" class="visually-hidden">Enter code</label>
          <input
            type="text"
            id="code"
            name="code"
            placeholder="Enter 6-digit code"
            maxlength="6"
            required
            style="text-align: center; letter-spacing: 4px; font-size: 18px"
          />
          {% if errors.code %}
          <div class="error">{{ errors.code }}</div>
          {% endif %}
        </div>

        <div style="margin-bottom: 24px">
          <a
            href="{{ resend_url }}"
            style="color: #00b37e; font-weight: 600; font-size: 14px"
            >Didn't get a code?</a
          >
        </div>

        <div class="buttons-group">
          <a href="{{ previous_url }}" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-submit">Continue</button>
        </div>
      </form>
    </div>
  </body>
</html>
