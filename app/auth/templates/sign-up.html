<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up — VietCare</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('auth.static', filename='css/common.css') }}" />
  <link rel="stylesheet" href="{{ url_for('auth.static', filename='css/pages/sign-up.css') }}" />
</head>

<body>
  <div class="site-wrap">
    <div class="signup-card">
      <div class="signup-visual">
        <img src="{{ url_for('static', filename='images/brand.png') }}" alt="VietCare Brand" class="visual-brand-img" />

        <div class="visual-text-content">
          <h3>VietCare</h3>
          <p>
            Your trusted companion for residency, healthcare, and safety in Ho
            Chi Minh City.
          </p>

          <div class="visual-badges">
            <span class="badge-pill">Emergency-ready</span>
            <span class="badge-pill">Multilingual</span>
            <span class="badge-pill">Privacy-first</span>
          </div>
        </div>
      </div>

      <div class="signup-content">
        <div class="form-header">
          <h2 class="form-title">Create Account</h2>
          <p class="form-subtitle">
            Already have an account?
            <a href="{{url_for('auth.signin_page')}}">Sign in</a>
          </p>
        </div>

        <form id="signupForm" novalidate action="/auth/signup" method="POST">
          <div class="field">
            <label for="fullname">Full Name</label>
            <input id="fullname" name="fullname" type="text" placeholder="Ex: Nam Pham" required />
            <div class="error" id="err-name" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="name@example.com" required />
            <div class="error" id="err-email" aria-live="polite"></div>
          </div>

          <div class="row-group">
            <div class="field">
              <label for="phone">Phone (Optional)</label>
              <input id="phone" name="phone" type="text" placeholder="+84..." />
            </div>
            <div class="field">
              <label for="lang">Language</label>
              <div class="select-wrapper">
                <select id="lang" name="lang">
                  {% if form_data.lang == 'en' %}
                  <option value="en" selected>English</option>
                  {% else %}
                  <option value="en">English</option>
                  {% endif %} {% if form_data.lang == 'vi' %}
                  <option value="vi" selected>Tiếng Việt</option>
                  {% else %}
                  <option value="vi">Tiếng Việt</option>
                  {% endif %} {% if form_data.lang == 'zh' %}
                  <option value="zh" selected>中文</option>
                  {% else %}
                  <option value="zh">中文</option>
                  {% endif %} {% if form_data.lang == 'ja' %}
                  <option value="ja" selected>日本語</option>
                  {% else %}
                  <option value="ja">日本語</option>
                  {% endif %}
                </select>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div style="position: relative">
              <input id="password" name="password" type="password" placeholder="At least 8 characters" required />
              <button type="button" id="togglePw" class="btn-show-pass" title="Show / Hide password">
                Show
              </button>
            </div>
            <div class="pw-meter" aria-hidden="true">
              <span id="pwBar" style="width: 0%"></span>
            </div>
            <div class="note" id="pwNote">
              Use 8+ chars with number & symbol.
            </div>
            <div class="error" id="err-pw" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="confirm">Confirm Password</label>
            <input id="confirm" name="confirm" type="password" placeholder="Repeat password" required />
            <div class="error" id="err-confirm" aria-live="polite"></div>
          </div>

          <div class="terms">
            <input id="agree" type="checkbox" />
            <label for="agree">
              I agree to the <a href="#">Terms</a> and
              <a href="#">Privacy Policy</a>.
            </label>
          </div>
          <div class="error" id="err-terms">{{ errors.terms or '' }}</div>

          <button class="btn-submit" type="submit">Create account</button>

          <div class="divider">or continue with</div>

          <div class="socials">
            <a href="{{ url_for('auth.google_login') }}" class="oauth-btn">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google" />
              Google
            </a>
          </div>
        </form>

        <div class="footer-link">
          <a href="{{url_for('home_page')}}">← Back to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('auth.static', filename='scripts/common.js') }}"></script>
  <script src="{{ url_for('auth.static', filename='scripts/pages/sign-up.js') }}"></script>
</body>

</html>
